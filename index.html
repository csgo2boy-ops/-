<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F9">
<meta name="description" content="把歌詞或課文分成小段，標出它在原曲裡的位置反覆聽，再錄下自己的發音來對比。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="跟讀筆記">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<title>跟讀筆記</title>
<style>
:root{
  --ink:#1B2A4A;--ink-soft:#5A6880;--ink-faint:#9AA3B2;
  --paper:#F7F8F9;--card:#FFFFFF;--rule:#E3E6EB;
  --live:#D6453A;--mark:#2F6FB8;--sel:#DCE6F4;--hi:#FFE9A8;--amber:#B07908;
}
:root[data-theme="dark"] {
  --ink:#E3E6EB;--ink-soft:#9AA3B2;--ink-faint:#5A6880;
  --paper:#121620;--card:#1A2332;--rule:#2B374E;
  --live:#E57373;--mark:#4B8FE3;--sel:#23354E;--hi:#5A4C24;--amber:#E0A836;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;transition: background-color 0.3s, color 0.3s;}
body{background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK TC",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topstick{position:sticky;top:0;z-index:22;background:rgba(247,248,249,.97);backdrop-filter:blur(8px)}
:root[data-theme="dark"] .topstick { background:rgba(18,22,32,.97); }

.bar{display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;border-bottom:1px solid var(--rule)}
.bar h1{margin:0;font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:15px;font-weight:400;color:var(--ink-soft);text-align:center}
.tbtn{padding:7px 12px;border:1px solid var(--rule);border-radius:7px;font-size:14px;
  color:var(--ink-soft);background:var(--card);white-space:nowrap;transition:border-color .15s,color .15s, background .15s}
.tbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
.tbtn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{flex:1;padding:4px 18px calc(env(safe-area-inset-bottom) + 36px)}

.tag-filter { display:flex; gap:8px; padding: 0 18px 10px; overflow-x:auto; white-space:nowrap; border-bottom:1px solid var(--rule); scrollbar-width: none; }
.tag-filter::-webkit-scrollbar { display: none; }
.tag-filter button { padding:5px 12px; border-radius:14px; font-size:13.5px; background:var(--card); border:1px solid var(--rule); color:var(--ink-soft); transition:all .2s;}
.tag-filter button.on { background:var(--ink); color:var(--card); border-color:var(--ink); font-weight:500;}
.tag-chip { display:inline-flex; align-items:center; font-size:12px; padding:2px 8px; border-radius:6px; margin-right:6px; margin-top:6px; }

#volrow{border-bottom:1px solid var(--rule);background:rgba(247,248,249,.97)}
:root[data-theme="dark"] #volrow { background:rgba(18,22,32,.97); }
#volrow[hidden]{display:none}
.vol{display:flex;align-items:center;gap:10px;padding:7px 18px;flex-wrap:wrap}
.vol .grp{display:flex;align-items:center;gap:7px;flex:1;min-width:180px}
.vol .gl{font-size:12px;color:var(--ink-faint);flex:none;min-width:30px}
.vol .pc{font-size:12px;color:var(--ink-faint);flex:none;min-width:34px;text-align:right}
.vol input[type=range]{flex:1;min-width:70px}

#srcctl{border-bottom:1px solid var(--rule)}
#srcctl[hidden]{display:none}
.src{display:flex;align-items:center;gap:8px;padding:8px 18px;transition:background .2s}
.src.on{background:var(--sel)}
.src.loop{background:var(--hi)}
.src .rd{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--ink);
  background:var(--ink);color:var(--card);display:inline-flex;align-items:center;justify-content:center}
.src .rd:hover{opacity:.85}
.src .tm{font-size:12px;color:var(--ink-faint);flex:none;min-width:32px}
.src .jp{font-size:12px;color:var(--ink-soft);flex:none;padding:0 7px;height:25px;
  border:1px solid var(--rule);border-radius:13px;background:var(--card)}
.src .jp:hover{border-color:var(--ink-faint)}
.src .lk{font-size:12px;color:var(--mark);flex:none;padding:0 9px;height:25px;text-decoration:none;
  border:1px solid var(--rule);border-radius:13px;background:var(--card);display:inline-flex;align-items:center}
.src .nm{font-size:13px;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:36px;height:20px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--ink);margin-top:-5px}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--rule)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--ink)}

#srcmedia{overflow:hidden;transition:max-height .22s ease;max-height:0}
#srcmedia.open{max-height:300px}
.mediabox{padding:8px 18px 4px;display:flex;justify-content:center}
.frame{position:relative;width:320px;max-width:100%;border-radius:10px;overflow:hidden;background:#000;
  border:1px solid var(--rule)}
.frame.ratio{aspect-ratio:16/9;height:auto}
.frame.ratio iframe{position:absolute;inset:0;width:100%;height:100%}
.src .ops{display:flex;align-items:center;gap:8px;flex:none}
.prac .pops{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none}

@media (pointer:coarse){
  .tbtn{padding:9px 14px;font-size:15px}
  .src .rd{width:40px;height:40px}
  .src .jp,.src .lk{height:34px;padding:0 11px;font-size:13px}
  .ctl button{height:36px;padding:0 13px;font-size:14px}
  .ctl button.ghost{padding:0 11px}
  .ctl button.nudge{height:34px;padding:0 12px;font-size:13px}
  .speed button{height:38px;font-size:14px}
  .prac button{height:38px;padding:0 14px;font-size:14px}
  .fbtn{padding:11px 15px;font-size:15px}
  .tip button{padding:6px 8px;font-size:18px}
  input[type=range]{height:32px}
  input[type=range]::-webkit-slider-thumb{width:17px;height:17px;margin-top:-7px}
  input[type=range]::-moz-range-thumb{width:17px;height:17px}
  .note-row{padding:18px 0}
  .note-wrap .note-dots { padding: 0 16px; }
}

@media (min-width:561px) and (pointer:coarse){
  #app{max-width:840px}
  .txt{font-size:18px;line-height:2.1}
  .frame{width:400px}
}
@media (min-width:561px) and (pointer:coarse) and (orientation:landscape){
  #app{max-width:940px}
  .frame{width:440px}
}
@media (min-width:561px) and (max-width:1100px) and (pointer:fine){
  #app{max-width:820px}
}
@media (max-width:560px){
  #app{max-width:100%}
  main{padding:4px 14px calc(env(safe-area-inset-bottom) + 30px)}
  .bar{padding-left:14px;padding-right:14px;gap:8px}
  .bar h1{font-size:16px}
  .bar .sub{font-size:14px}
  .tbtn{padding:8px 11px;font-size:14px}
  .src{padding:8px 14px;flex-wrap:wrap;row-gap:6px}
  .src .ops{flex-basis:100%;justify-content:space-between;gap:6px}
  .src .lk{margin-left:auto}
  .vol{padding:7px 14px;gap:6px}
  .vol .grp{min-width:100%}
  .mediabox{padding:8px 14px 4px}
  .frame{width:100%}
  #srcmedia.open{max-height:62vw}
  .para{padding-left:13px}
  .ctl{gap:6px}
  .ctl .quo{max-width:140px}
  .prac{padding:8px 14px;row-gap:7px}
  .prac .st{flex-basis:100%;min-width:100%}
  .prac .pops{width:100%;gap:6px}
  .prac .pops button{flex:1 1 auto;justify-content:center}
  .prac .pops button.main{flex:1 1 26%;font-weight:600}
  .speed{padding:7px 14px calc(env(safe-area-inset-bottom) + 7px);gap:5px}
  .speed .lb{display:none}
  .steps{margin:24px auto;padding:16px}
  .cmp canvas{height:88px}
  #toast{bottom:calc(env(safe-area-inset-bottom) + 118px)}
}

@media (orientation:landscape) and (max-height:480px){
  .bar{padding-top:calc(env(safe-area-inset-top) + 7px);padding-bottom:7px}
  .src{padding-top:5px;padding-bottom:5px}
  #srcmedia.open{max-height:36vh}
  .txt{line-height:1.85}
  .para{padding-top:5px;padding-bottom:4px}
  .speed{padding-top:5px}
  .tip{display:none}
}
.frame.flat iframe{display:block;width:100%;border:0}
.frame iframe{border:0}
.notice{max-width:460px;padding:13px 15px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-size:13.5px;line-height:1.85;color:var(--ink-soft)}
.notice b{color:var(--ink);font-weight:600}
.notice a{color:var(--mark)}
.notice code{background:var(--sel);border-radius:4px;padding:1px 5px;font-size:12.5px}
@media (prefers-reduced-motion:reduce){#srcmedia{transition:none}}

.note-wrap { display:flex; align-items:stretch; border-bottom:1px solid var(--rule); transition: background .15s;}
.note-wrap:hover { background: rgba(0,0,0,0.02); }
:root[data-theme="dark"] .note-wrap:hover { background: rgba(255,255,255,0.02); }
.note-row{display:block; flex:1; text-align:left; padding:15px 0;}
.note-row .t{font-size:16px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row .m{font-size:13px;color:var(--ink-faint);display:flex;gap:10px;align-items:center}
.del-btn { color:var(--live); border:1px solid var(--live); border-radius:6px; padding:5px 12px; font-size:13px; background:transparent; transition: .2s; height: 30px; display: flex; align-items: center; justify-content: center; }
.del-btn:hover { background:var(--live); color:#fff; }

.empty{padding:52px 8px;text-align:center;color:var(--ink-faint);font-size:15px;line-height:2}
.steps{max-width:410px;margin:40px auto;padding:18px 20px;border:1px solid var(--rule);
  border-radius:12px;background:var(--card)}
.steps h3{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--ink)}
.steps ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink-soft);line-height:2}
.tip{font-size:12.5px;color:var(--ink-faint);padding:9px 0 3px;line-height:1.8;
  display:flex;align-items:flex-start;gap:8px}
.tip span{flex:1}
.tip button{flex:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:2px 4px}

.para{position:relative;padding:7px 0 5px 16px;border-left:3px solid transparent}
.para.lp{border-left-color:var(--amber)}
.para.full{border-left-color:var(--mark)}
.para.rec{border-left-color:var(--live);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.para.rec{animation:none}}
.txt{font-size:17px;line-height:2.05;letter-spacing:.01em;white-space:pre-wrap;word-break:normal;overflow-wrap:break-word; cursor:text;}

.tok{display:inline;border-radius:3px;padding:1px 0;cursor:pointer;transition:background .12s}
.tok.sel{background:var(--sel)}
.tok.has{box-shadow:inset 0 -2px 0 var(--mark)}
.tok.lp{box-shadow:inset 0 -2px 0 var(--amber)}
.tok.has.lp{box-shadow:inset 0 -2px 0 var(--mark),inset 0 -4px 0 var(--amber)}
.tok.play{background:var(--hi)}
.tok.ring{background:var(--hi)}
:root[data-theme="dark"] .tok:hover:not(.has):not(.lp){background:#23354E}
:root[data-theme="light"] .tok:hover:not(.has):not(.lp){background:#EDF0F4}

.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:5px;padding-bottom:2px}
.ctl button{display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 10px;border-radius:15px;
  border:1px solid var(--rule);background:var(--card);font-size:13px;color:var(--ink-soft);
  transition:border-color .15s,color .15s,background .15s}
.ctl button:hover{border-color:var(--ink-faint);color:var(--ink)}
.ctl button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ctl button.live{background:var(--live);color:#fff;border-color:var(--live)}
.ctl button.stamp{color:var(--amber);border-color:var(--amber);background:var(--card)}
.ctl button.stamp:hover{border-color:var(--amber); color:var(--amber)}
.ctl button.stamp.ring{background:var(--amber);color:var(--card);border-color:var(--amber)}
.ctl button.ghost{border-color:transparent;color:var(--ink-faint);padding:0 7px}
.ctl button.ghost:hover{border-color:var(--rule);color:var(--ink-soft)}
.ctl button.nudge{height:26px;padding:0 8px;font-size:12px;border-radius:13px;
  color:var(--amber);border-color:var(--amber)}

/* Big sync buttons */
.ctl button.big-sync { height: 34px; font-weight: 600; padding: 0 14px; font-size: 14px; background: var(--amber); color: var(--card); border-color: var(--amber); }
.ctl button.big-sync:hover { opacity: 0.9; }

.ctl .dur{font-size:12px;color:var(--ink-faint)}
.ctl .quo{font-size:12px;color:var(--ink-faint);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .fine{display:flex;align-items:center;gap:4px;flex-wrap:wrap;width:100%;margin-top:3px;
  padding:6px 9px;border:1px solid var(--amber);border-radius:9px;background:var(--card)}
.ctl .fine .lb{font-size:12px;color:var(--amber);margin-right:2px}
.wavebox{width:100%;margin:1px 0 6px;position:relative}
.wavebox canvas{display:block;width:100%;height:64px;border-radius:7px;
  background:var(--card);border:1px solid var(--amber);touch-action:none;cursor:ew-resize}
.wavebox .msg{padding:12px 10px;font-size:12.5px;color:var(--ink-faint);text-align:center;
  border:1px dashed var(--amber);border-radius:7px;line-height:1.7}
.cmp{width:100%;margin:2px 0 4px;padding:8px 9px;border:1px solid var(--rule);
  border-radius:9px;background:var(--card)}
.cmp canvas{display:block;width:100%;height:78px}
.cmp .rowlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);
  margin-top:4px}
.cmp .verdict{font-size:12.5px;color:var(--ink-soft);margin-top:5px;line-height:1.6}
.cmp .verdict b{color:var(--ink)}

.para.now{background:var(--sel);border-radius:0 8px 8px 0}
.prac{position:sticky;bottom:0;z-index:21;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:9px 18px;border-top:1px solid var(--amber);background:var(--card)}
.prac[hidden]{display:none}
.prac .st{font-size:12.5px;color:var(--amber);flex:1;min-width:120px;font-weight:600}
.prac button{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--amber);
  background:var(--card);font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.prac button:hover{border-color:var(--amber);color:var(--ink)}
.prac button.key{background:var(--amber);color:var(--card);border-color:var(--amber)}
.prac button.rec{background:var(--live);color:#fff;border-color:var(--live)}
.prac button.tog{color:var(--amber)}
.prac button.tog.on{background:var(--amber);color:var(--card)}
.ico{width:13px;height:13px;flex:none;display:block}
.ico-lg { width:18px; height:18px;}

.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule)}
.foot .cnt{font-size:13px;color:var(--ink-faint);margin-bottom:14px}
.orphan{margin-top:18px;padding:14px 15px;border:1px solid var(--amber);border-radius:10px;background:var(--card)}
.orphan h3{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--amber)}
.orphan p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.orow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 0}
.orow .q{font-size:13px;color:var(--ink);flex:1;min-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ti{width:100%;padding:12px 15px;margin-bottom:9px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-family:inherit;font-size:17px;font-weight:600;color:var(--ink);outline:none}
.ti:focus{border-color:var(--ink-faint)}
.ti::placeholder{font-weight:400;color:var(--ink-faint)}
textarea{width:100%;min-height:36dvh;padding:15px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);font-family:inherit;font-size:17px;line-height:2;color:var(--ink);resize:vertical;outline:none}
textarea:focus{border-color:var(--ink-faint)}
.hint{font-size:12.5px;color:var(--ink-faint);margin:9px 2px 0;line-height:1.75}

.sec{margin-top:20px;padding-top:15px;border-top:1px solid var(--rule)}
.sec h2{margin:0 0 9px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fbtn{padding:8px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--card);
  font-size:14px;color:var(--ink-soft)}
.fbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
.fname{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.url{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);outline:none}
.url:focus{border-color:var(--ink-faint)}
.badge{font-size:12px;color:var(--mark);background:var(--sel);border-radius:5px;padding:2px 7px}

.speed{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:7px;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
  border-top:1px solid var(--rule);background:rgba(247,248,249,.95);backdrop-filter:blur(8px)}
:root[data-theme="dark"] .speed { background:rgba(18,22,32,.95); }
.speed .lb{font-size:12.5px;color:var(--ink-faint)}
.speed button{flex:1;height:30px;border-radius:7px;border:1px solid var(--rule);
  background:var(--card);font-size:13px;color:var(--ink-soft)}
.speed button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ══ 说明面板 ══ */
#sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.6)}
#sheet.show{display:flex;align-items:flex-end;justify-content:center}
.sheetbox{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--paper);
  border-radius:16px 16px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
  animation:rise .2s ease}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheetbox{animation:none}}
@media (min-width:561px){
  #sheet.show{align-items:center}
  .sheetbox{border-radius:16px;padding-bottom:24px}
}
.sheetbox h2{margin:0 0 4px;font-size:18px;font-weight:600}
.sheetbox h3{margin:18px 0 6px;font-size:14px;font-weight:600;color:var(--ink)}
.sheetbox p{margin:0 0 8px;font-size:14px;line-height:1.85;color:var(--ink-soft)}
.sheetbox ul{margin:0 0 8px;padding-left:19px;font-size:14px;line-height:1.85;color:var(--ink-soft)}
.sheetbox b{color:var(--ink)}
.sheetbox .warn{padding:12px 14px;border:1px solid var(--amber);border-radius:10px;background:var(--card);margin:0 0 10px}
.sheetbox .warn p{margin:0;color:var(--ink)}
.sheetbox .close{width:100%;margin-top:18px;height:42px;border-radius:9px;
  background:var(--ink);color:var(--card);font-size:15px}

/* ══ 有新版本 ══ */
#newver{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);
  z-index:65;display:none;align-items:center;gap:10px;padding:9px 10px 9px 15px;border-radius:10px;
  background:var(--ink);color:var(--card);font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
#newver.show{display:flex}

/* ═══ IndexedDB ═══ */
const DB_NAME="readalong", DB_VER=2;
let db;
function openDB(){
  return new Promise((res,rej)=>{
    let done=false;
    const finish=(fn,v)=>{ if(!done){ done=true; clearTimeout(timer); fn(v); } };
    const timer=setTimeout(()=>finish(rej,new Error("TIMEOUT")),8000);
    let rq;
    try{ rq=indexedDB.open(DB_NAME,DB_VER); }
    catch(err){ finish(rej,err); return; }
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("notes")) d.createObjectStore("notes",{keyPath:"id"});
      if(!d.objectStoreNames.contains("recs")){
        const s=d.createObjectStore("recs",{keyPath:"id"});
        s.createIndex("noteId","noteId",{unique:false});
      }
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"});
      if(!d.objectStoreNames.contains("media")) d.createObjectStore("media",{keyPath:"noteId"});
    };
    rq.onblocked=()=>finish(rej,new Error("BLOCKED"));
    rq.onsuccess=()=>{
      const d=rq.result;
      d.onversionchange=()=>{
        d.close();
        bootBlocked("應用程式已在另一個分頁更新",
          `<p>為了讓新版本啟動，這個頁面的連線已經斷開。<br>重新整理即可繼續，資料不受影響。</p>`);
      };
      finish(res,d);
    };
    rq.onerror=()=>finish(rej,rq.error||new Error("DB_ERROR"));
  });
}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);

const Store={
  async listNotes(){ return (await req(tx("notes","readonly").getAll())).sort((a,b)=>b.updatedAt-a.updatedAt); },
  async getNote(id){ return req(tx("notes","readonly").get(id)); },
  async saveNote(n){ n.updatedAt=Date.now(); await req(tx("notes","readwrite").put(n)); return n; },
  async createNote(){ const n={id:uid(),title:"",text:"",sourceUrl:"",loops:[],tags:[],ttsLang:"",updatedAt:Date.now()};
    await req(tx("notes","readwrite").put(n)); return n; },
  async deleteNote(id){
    const rs=await this.listRecs(id);
    const t=db.transaction(["notes","recs","media"],"readwrite");
    t.objectStore("notes").delete(id);
    t.objectStore("media").delete(id);
    rs.forEach(r=>t.objectStore("recs").delete(r.id));
    return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});
  },
  async allRecs(){ return req(tx("recs","readonly").getAll()); },
  async listRecs(noteId){ return req(tx("recs","readonly").index("noteId").getAll(noteId)); },
  async putRec(r){ await req(tx("recs","readwrite").put(r)); return r; },
  async deleteRec(id){ return req(tx("recs","readwrite").delete(id)); },
  async getMedia(noteId){ return req(tx("media","readonly").get(noteId)); },
  async putMedia(m){ await req(tx("media","readwrite").put(m)); return m; },
  async deleteMedia(noteId){ return req(tx("media","readwrite").delete(noteId)); },
  async getKV(k,d){ const r=await req(tx("kv","readonly").get(k)); return r?r.v:d; },
  async setKV(k,v){ return req(tx("kv","readwrite").put({k,v})); }
};

/* ═══ AudioContext 優化單例模式 ═══ */
let sharedAC = null;
function getAudioContext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error("no ac");
  if (!sharedAC) sharedAC = new AC();
  if (sharedAC.state === 'suspended') sharedAC.resume();
  return sharedAC;
}

/* ═══ MediaSession API 鎖屏控制 ═══ */
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  if (S.route === 'note' && S.note && Src.controllable) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: noteTitle(S.note),
      artist: '跟讀筆記',
      album: '我的練習'
    });
    navigator.mediaSession.setActionHandler('play', async () => {
      if(Src.controllable) await Src.toggle();
    });
    navigator.mediaSession.setActionHandler('pause', () => {
      Player.stop(); Src.pause();
    });
    navigator.mediaSession.setActionHandler('seekbackward', () => { if(Src.controllable) Src.jump(-5); });
    navigator.mediaSession.setActionHandler('seekforward', () => { if(Src.controllable) Src.jump(5); });
  } else {
    navigator.mediaSession.metadata = null;
  }
}

/* ═══ 录音 ═══ */
function pickMime(){
  if(typeof MediaRecorder==="undefined") return null;
  for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg"]){
    try{ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)) return m; }catch(_){}
  }
  return "";
}
const Recorder={
  stream:null,mr:null,chunks:[],startedAt:0,active:false,
  async start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("NO_API");
    if(typeof MediaRecorder==="undefined") throw new Error("NO_RECORDER");
    if(!this.stream) this.stream=await navigator.mediaDevices.getUserMedia({
      audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    const m=pickMime();
    this.mr=m?new MediaRecorder(this.stream,{mimeType:m}):new MediaRecorder(this.stream);
    this.chunks=[];
    this.mr.ondataavailable=e=>{ if(e.data&&e.data.size) this.chunks.push(e.data); };
    this.mr.onerror=()=>{ this.active=false; };
    this.mr.start(); this.startedAt=Date.now(); this.active=true;
  },
  stop(){
    return new Promise(res=>{
      if(!this.mr||!this.active){ this.chunks=[]; return res(null); }
      const ms=Date.now()-this.startedAt;
      const done=()=>{
        this.active=false;
        const type=(this.mr&&this.mr.mimeType)||"audio/webm";
        const blob=new Blob(this.chunks,{type});
        this.chunks=[];
        res(blob.size?{blob,durationMs:ms}:null);
      };
      this.mr.onstop=done;
      try{ this.mr.stop(); }catch(_){ done(); }
    });
  },
  release(){
    try{ if(this.mr&&this.active) this.mr.stop(); }catch(_){}
    if(this.stream){ this.stream.getTracks().forEach(t=>{try{t.stop()}catch(_){}}); this.stream=null; }
    this.mr=null; this.active=false; this.chunks=[];
  }
};

/* ═══ 录音回放 ═══ */
const Player={
  el:null,url:null,curId:null,after:null,
  init(){
    this.el=new Audio(); this.el.preload="auto";
    this.el.addEventListener("ended",()=>{
      const f=this.after; this.after=null;
      this.stop();
      if(f) f();
    });
    this.el.addEventListener("error",()=>{this.after=null;this.stop();toast("這段錄音讀取失敗")});
  },
  async play(rec,rate,after){
    if(!rec||!rec.blob||!rec.blob.size){ toast("這段錄音的檔案遺失了，請重新錄製"); return; }
    this.stop(); Loop.stop(); Src.pause();
    try{ this.url=URL.createObjectURL(rec.blob); }
    catch(_){ toast("這段錄音讀取失敗"); return; }
    this.after=after||null;
    this.el.src=this.url;
    this.el.preservesPitch=true; this.el.mozPreservesPitch=true; this.el.webkitPreservesPitch=true;
    this.el.playbackRate=rate;
    this.el.volume=Math.max(0,Math.min(1,S.volRec));
    this.curId=rec.id; render();
    try{ await this.el.play(); }
    catch(_){ this.after=null; this.stop(); toast("播放被攔截，請再點一次"); }
  },
  stop(){
    if(this.el){ this.el.pause(); this.el.removeAttribute("src"); this.el.load(); }
    if(this.url){ URL.revokeObjectURL(this.url); this.url=null; }
    if(this.curId){ this.curId=null; render(); }
  }
};

/* ═══ 来源解析 ═══ */
const AUDIO_EXT=/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|mp4|webm)(\?|#|$)/i;
function parseSource(url){
  if(!url) return {type:"none"};
  const u=url.trim();
  let m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
  if(m){
    let st=0; const tm=u.match(/[?&]t=(\d+)/); if(tm) st=+tm[1];
    return {type:"yt",id:m[1],start:st};
  }
  m=u.match(/open\.spotify\.com\/(?:intl-[\w-]+\/)?(track|episode|album|playlist)\/([A-Za-z0-9]+)/i);
  if(m) return {type:"embed",src:"https://open.spotify.com/embed/"+m[1]+"/"+m[2],height:152,name:"Spotify"};
  if(/(^|\/\/)(www\.)?soundcloud\.com\//i.test(u))
    return {type:"embed",src:"https://w.soundcloud.com/player/?url="+encodeURIComponent(u)+"&color=%231B2A4A&show_comments=false",
      height:126,name:"SoundCloud"};
  m=u.match(/bilibili\.com\/video\/(BV[A-Za-z0-9]+)/i);
  if(m) return {type:"embed",src:"https://player.bilibili.com/player.html?bvid="+m[1]+"&autoplay=0&danmaku=0",
    ratio:true,name:"嗶哩嗶哩"};
  if(AUDIO_EXT.test(u)) return {type:"audio",src:u};
  return {type:"link"};
}

/* ═══ YouTube API ═══ */
let ytApiPromise=null;
function loadYTApi(){
  if(window.YT&&window.YT.Player) return Promise.resolve();
  if(ytApiPromise) return ytApiPromise;
  ytApiPromise=new Promise((res,rej)=>{
    const timer=setTimeout(()=>rej(new Error("YT_TIMEOUT")),12000);
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ clearTimeout(timer); if(prev) try{prev()}catch(_){} res(); };
    const s=document.createElement("script");
    s.src="https://www.youtube.com/iframe_api";
    s.onerror=()=>{ clearTimeout(timer); rej(new Error("YT_LOAD")); };
    document.head.appendChild(s);
  });
  return ytApiPromise;
}

/* ═══ 原曲 ═══ */
const Src={
  kind:null, el:null, url:null, yt:null, ytOn:false, seeking:false, poll:null, info:null,
  init(){
    this.el=document.getElementById("srcaudio");
    this.el.addEventListener("timeupdate",()=>{ Loop.check(); syncSrc(); });
    this.el.addEventListener("loadedmetadata",()=>renderSrcCtl());
    this.el.addEventListener("play",()=>renderSrcCtl());
    this.el.addEventListener("pause",()=>renderSrcCtl());
    this.el.addEventListener("ended",()=>{ Loop.stop(); renderSrcCtl(); });
    this.el.addEventListener("error",()=>{
      if(this.kind!=="audio") return;
      this.notice(`<p style="margin:0"><b>這個音檔無法讀取</b><br>請使用右邊的連結在新分頁打開。</p>`);
    });
  },
  get controllable(){ return this.kind==="audio"||(this.kind==="yt"&&this.ytOn); },
  duration(){
    if(this.kind==="audio") return this.el.duration;
    if(this.kind==="yt"&&this.ytOn){ try{ return this.yt.getDuration(); }catch(_){ return NaN; } }
    return NaN;
  },
  now(){
    if(this.kind==="audio") return this.el.currentTime;
    if(this.kind==="yt"&&this.ytOn){ try{ return this.yt.getCurrentTime(); }catch(_){ return 0; } }
    return 0;
  },
  paused(){
    if(this.kind==="audio") return this.el.paused;
    if(this.kind==="yt"&&this.ytOn){ try{ return this.yt.getPlayerState()!==1; }catch(_){ return true; } }
    return true;
  },
  notice(html){
    this.stopPoll();
    if(this.yt){ try{ this.yt.destroy(); }catch(_){} this.yt=null; }
    this.ytOn=false; this.kind="notice";
    const box=document.getElementById("srcmedia");
    if(box) box.innerHTML=`<div class="mediabox"><div class="notice">${html}</div></div>`;
    renderSrcBar();
  },
  loadAudio(src,isBlob){
    this.kind="audio";
    try{ this.url=isBlob?URL.createObjectURL(src):src; }catch(_){ this.kind=null; return; }
    this.el.src=this.url;
    this.el.preservesPitch=true; this.el.mozPreservesPitch=true; this.el.webkitPreservesPitch=true;
    this.el.playbackRate=S.rate;
    this.el.volume=Math.max(0,Math.min(1,S.volSrc));
    updateMediaSession();
  },
  async loadYT(id,startAt){
    if(location.protocol!=="http:"&&location.protocol!=="https:"){
      this.notice(`<p style="margin:0 0 8px"><b>YouTube 不接受以本地檔案方式打開的頁面</b></p>
        <p style="margin:0 0 8px">目前的頁面是直接使用 <code>file://</code> 開啟，
        嵌入播放會遭到拒絕（錯誤代碼 153）。請改用以下方式：</p>
        <p style="margin:0 0 6px">將這個 html 檔案拖曳至 
        <a href="https://app.netlify.com/drop" target="_blank" rel="noopener noreferrer">app.netlify.com/drop</a>
        ，以取得一個正式的 https 網址（手機也能用）。</p>
        <p style="margin:0">或在檔案所在資料夾執行 <code>npx serve</code>，
        並使用它提供的 <code>http://localhost:…</code> 網址開啟。</p>`);
      return;
    }
    this.kind="yt"; this.ytOn=false;
    const box=document.getElementById("srcmedia");
    box.innerHTML=`<div class="mediabox"><div class="frame ratio"><div id="ytmount"></div></div></div>`;
    renderSrcBar();
    try{ await loadYTApi(); }

  loadEmbed(info){

  startPoll(){

    this.poll=setInterval(()=>{ if(this.kind==="yt"&&this.ytOn){ Loop.check(); syncSrc(); } },POLL_MS);
  },
  stopPoll(){ if(this.poll){ clearInterval(this.poll); this.poll=null; } },
  clear(){

    try{ this.el.pause(); this.el.removeAttribute("src"); this.el.load(); }catch(_){}

  async toggle(){

    if(this.paused()){ Player.stop(); this.setRate(S.rate); await this.play(); }
    else this.pause();
  },
  seekTo(sec){
    if(!this.controllable) return;
    if(this.kind==="audio") this.el.currentTime=Math.max(0,sec);
    else { try{ this.yt.seekTo(Math.max(0,sec),true); }catch(_){} }
  },
  async seekPlay(sec){
    if(!this.controllable) return;

    this.seekTo(sec);
    await this.play();
    syncSrc();
  },
  jump(sec){
    const d=this.duration();
    if(!this.controllable||!isFinite(d)) return;

      }catch(_){}
    }
  }
};

/* ═══ 区间循环 ═══ */
const Loop={
  id:null, a:0, b:0, timer:null, guard:0, once:false, after:null,
  get on(){ return this.id!==null; },
  async start(lp,opt){
    if(!Src.controllable) return;
    Player.stop();
    this.id=lp.id; this.a=lp.a; this.b=loopEnd(lp);
    this.once=!!(opt&&opt.once); this.after=(opt&&opt.after)||null;
    Src.setRate(S.rate);
    Src.seekTo(this.a);
    this.guard=Date.now();
    await Src.play();
    if(this.timer) clearInterval(this.timer);
    this.timer=setInterval(()=>this.check(),LOOP_MS);
    render();
  },
  check(){
    if(!this.on||!Src.controllable) return;
    if(Src.paused()) return;
    if(Date.now()-this.guard<250) return;
    const t=Src.now();
    if(t>=this.b||t<this.a-1){
      if(this.once){
        Src.pause();
        const f=this.after;
        this.stop();
        if(f) f();
        return;
      }
      this.guard=Date.now();
      Src.seekTo(this.a);
    }
  },
  retune(lp){
    if(!this.on||this.id!==lp.id) return;
    this.a=lp.a; this.b=loopEnd(lp);
    this.guard=Date.now();
    Src.seekTo(this.a);
  },
  stop(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    this.once=false; this.after=null;
    if(this.id!==null){ this.id=null; if(S.route==="note") render(); }
  }
};

const fmtS=s=>isFinite(s)&&s>=0?fmt(s*1000):"–:––";
const fmtS1=s=>{
  if(!isFinite(s)||s<0) return "–:––";
  const m=Math.floor(s/60), r=s-m*60;
  return m+":"+(r<10?"0":"")+r.toFixed(1);
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const liveRecs=()=>S.recs.filter(r=>!r.stale);
const staleRecs=()=>S.recs.filter(r=>r.stale);
const recsOf=pi=>liveRecs().filter(r=>r.paraIndex===pi);
const recCovering=(pi,s,e)=>recsOf(pi).find(r=>!r.full&&r.start<=s&&r.end>=e);
const fullRec=pi=>recsOf(pi).find(r=>r.full);

const loops=()=>(S.note&&S.note.loops)||[];
const loopsOf=pi=>loops().filter(l=>!l.stale&&l.pi===pi);
const loopCovering=(pi,s,e)=>loopsOf(pi).find(l=>l.start<=s&&l.end>=e);
const loopExact=(pi,s,e)=>loopsOf(pi).find(l=>l.start===s&&l.end===e);
const loopById=id=>loops().find(l=>l.id===id);

function loopEnd(lp){
  if(typeof lp.b==="number"&&lp.b>lp.a) return lp.b;
  let best=Infinity;
  for(const o of loops()){
    if(o.id===lp.id||o.stale) continue;
    if(o.a>lp.a+0.3&&o.a<best) best=o.a;
  }
  if(best<Infinity) return best;
  const d=Src.duration();
  return isFinite(d)?Math.min(lp.a+DEF_SPAN,d):lp.a+DEF_SPAN;
}

/* ═══ LRC 歌词时间轴 ═══ */
function lrcSec(m,s,f){
  let frac=0;
  if(f!=null&&f!==""){
    frac=f.length===1?(+f)/10:f.length===2?(+f)/100:(+f)/1000;
  }
  return (+m)*60+(+s)+frac;
}
function lrcStamp(s){
  const t=Math.max(0,s), m=Math.floor(t/60), r=t-m*60;
  return String(m).padStart(2,"0")+":"+(r<10?"0":"")+r.toFixed(2);
}
function parseLRC(text){
  const out={offset:0,lines:[]};
  const tagRe=/^\s*\[([a-zA-Z]+):([^\]]*)\]\s*$/;
  const timeRe=/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  const wordRe=/<(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?>/g;
  for(const row of String(text).split(/\r?\n/)){
    const tag=row.match(tagRe);
    if(tag){
      if(tag[1].toLowerCase()==="offset") out.offset=(parseFloat(tag[2])||0)/1000;
      continue;
    }
    timeRe.lastIndex=0;
    const times=[]; let m, cut=0;
    while((m=timeRe.exec(row))!==null){
      times.push(lrcSec(m[1],m[2],m[3]));
      if(m.index+m[0].length>cut) cut=m.index+m[0].length;
    }
    if(!times.length) continue;
    const body=row.slice(cut);
    const words=[];
    wordRe.lastIndex=0;
    let wm, last=null, idx=0;
    while((wm=wordRe.exec(body))!==null){
      if(last!==null) words.push({t:last,text:body.slice(idx,wm.index).trim()});
      last=lrcSec(wm[1],wm[2],wm[3]);
      idx=wm.index+wm[0].length;
    }
    if(last!==null) words.push({t:last,text:body.slice(idx).trim()});
    const plain=body.replace(wordRe,"").replace(/\s+/g," ").trim();
    if(!plain) continue;
    for(const t of times)
      out.lines.push({t:t,text:plain,words:words.filter(w=>w.text)});
  }
  out.lines.sort((a,b)=>a.t-b.t);
  return out;
}
const lrcNorm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");

function lrcToLoops(lrc,list){
  const off=lrc.offset, made=[], used={};
  let hit=0;
  lrc.lines.forEach((ln,i)=>{
    const key=lrcNorm(ln.text);
    if(!key) return;
    let pi=-1;
    for(let j=0;j<list.length;j++){
      if(used[j]) continue;
      if(lrcNorm(list[j])===key){ pi=j; break; }
    }
    if(pi<0) return;
    used[pi]=true; hit++;
    const nxt=lrc.lines[i+1];
    made.push({id:uid(),pi:pi,start:0,end:list[pi].length,full:true,text:list[pi],
      a:Math.max(0,ln.t-off),b:nxt?Math.max(0,nxt.t-off):null});
    if(ln.words&&ln.words.length>1){
      let cursor=0;
      ln.words.forEach((w,k)=>{
        const at=list[pi].indexOf(w.text,cursor);
        if(at<0) return;
        cursor=at+w.text.length;
        const nw=ln.words[k+1];
        made.push({id:uid(),pi:pi,start:at,end:at+w.text.length,full:false,text:w.text,
          a:Math.max(0,w.t-off),
          b:nw?Math.max(0,nw.t-off):(nxt?Math.max(0,nxt.t-off):null)});
      });
    }
  });
  return {loops:made,hit:hit,total:lrc.lines.length};
}

function buildLRC(){
  const rows=[];
  if(S.note.title&&S.note.title.trim()) rows.push("[ti:"+S.note.title.trim()+"]");
  rows.push("[re:跟读笔记]");
  const all=loops();
  const lines=all.filter(l=>l.full).sort((a,b)=>a.a-b.a);
  for(const l of lines){
    const ws=all.filter(w=>!w.full&&w.pi===l.pi).sort((a,b)=>a.start-b.start);
    let body=l.text;
    if(ws.length){
      let acc="", cur=0;
      for(const w of ws){
        if(w.start<cur) continue;
        acc+=l.text.slice(cur,w.start)+"<"+lrcStamp(w.a)+">"+l.text.slice(w.start,w.end);
        cur=w.end;
      }
      body=acc+l.text.slice(cur);
    }
    rows.push("["+lrcStamp(l.a)+"]"+body);
  }
  return rows.join("\n");
}

/* ═══ 波形（自己解码，不依赖外部库） ═══ */
const Wave={
  peaks:null, dur:0, sr:500, state:"none", drag:null, view:null,
  reset(){ this.peaks=null; this.dur=0; this.state="none"; this.drag=null; this.view=null; },
  async build(blob){
    if(this.state==="busy") return;
    this.state="busy";
    try{
      const buf=await blob.arrayBuffer();
      const ctx=getAudioContext();
      const audio=await new Promise((res,rej)=>{
        const p=ctx.decodeAudioData(buf,res,rej);
        if(p&&p.then) p.then(res,rej);
      });
      const ch=audio.getChannelData(0);
      const n=Math.max(1,Math.ceil(audio.duration*this.sr));
      const pk=new Float32Array(n);
      const step=ch.length/n;
      for(let i=0;i<n;i++){
        const s=(i*step)|0, e=Math.min(ch.length,((i+1)*step)|0);
        let mx=0;
        for(let j=s;j<e;j++){ const v=ch[j]<0?-ch[j]:ch[j]; if(v>mx) mx=v; }
        pk[i]=mx;
      }
      this.peaks=pk; this.dur=audio.duration; this.state="ok";
    }catch(_){ this.reset(); this.state="fail"; }
    if(S.route==="note") render();
  },
  window(l){
    const b=loopEnd(l), span=Math.max(0.35,(b-l.a)*0.55);
    return {t0:Math.max(0,l.a-span), t1:Math.min(this.dur||b+span, b+span), a:l.a, b:b};
  },
  draw(cv,l){
    if(!cv||!this.peaks) return;
    const w=cv.clientWidth||320, h=64;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    if(cv.width!==((w*dpr)|0)||cv.height!==((h*dpr)|0)){ cv.width=(w*dpr)|0; cv.height=(h*dpr)|0; }
    const g=cv.getContext("2d");
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);
    const v=this.view||this.window(l);
    const span=Math.max(0.05,v.t1-v.t0);
    const xOf=t=>((t-v.t0)/span)*w;
    const ax=xOf(v.a), bx=xOf(v.b);

    const isDark = S.theme === 'dark';
    g.fillStyle= isDark ? "#282012" : "#F6EAD0";
    g.fillRect(Math.min(ax,bx),0,Math.abs(bx-ax),h);

    const mid=h/2;
    for(let x=0;x<w;x++){
      const t=v.t0+(x/w)*span;
      const i=Math.round(t*this.sr);
      let p=(i>=0&&i<this.peaks.length)?this.peaks[i]:0;
      const inside=t>=v.a&&t<=v.b;
      const amp=Math.max(0.6,p*(h*0.44));
      g.fillStyle=inside? (isDark ? "#E0A836":"#B07908") : (isDark ? "#5A4C24":"#D9CCB0");
      g.fillRect(x,mid-amp,1,amp*2);
    }
    for(const hx of [ax,bx]){
      g.fillStyle= isDark ? "#E0A836" : "#8A5E06";
      g.fillRect(hx-1,0,2,h);
      g.beginPath(); g.arc(hx,h-7,5,0,Math.PI*2); g.fill();
    }
    if(Src.controllable){
      const cx=xOf(Src.now());
      if(cx>=0&&cx<=w){ g.fillStyle= isDark ? "#FFF" : "#1B2A4A"; g.fillRect(cx-0.5,0,1.5,h); }
    }
  },
  timeAt(cv,ev,l){
    const r=cv.getBoundingClientRect();
    const v=this.view||this.window(l);
    const x=Math.min(Math.max(0,ev.clientX-r.left),r.width);
    return v.t0+(x/r.width)*Math.max(0.05,v.t1-v.t0);
  }
};

function mountWave(){
  const box=document.getElementById("wavebox");
  if(!box) return;
  const l=loopById(box.dataset.id);
  if(!l) return;
  const cv=box.querySelector("canvas");
  if(!cv) return;
  Wave.view=Wave.window(l);
  Wave.draw(cv,l);

  cv.addEventListener("pointerdown",e=>{
    const t=Wave.timeAt(cv,e,l), v=Wave.view;
    const thr=(v.t1-v.t0)*0.07;
    const da=Math.abs(t-v.a), dbv=Math.abs(t-v.b);
    if(da<=dbv&&da<thr) Wave.drag="a";
    else if(dbv<thr) Wave.drag="b";
    else { Loop.stop(); Src.seekPlay(t); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  cv.addEventListener("pointermove",e=>{
    if(!Wave.drag) return;
    const t=Wave.timeAt(cv,e,l);
    if(Wave.drag==="a") l.a=Math.max(0,Math.min(t,(typeof l.b==="number"?l.b:loopEnd(l))-0.1));
    else l.b=Math.max(l.a+0.1,t);
    Wave.view.a=l.a; Wave.view.b=(typeof l.b==="number"?l.b:loopEnd(l));
    Wave.draw(cv,l);
    const lab=document.getElementById("finelab");
    if(lab) lab.textContent="起 "+fmtS1(l.a)+"   止 "+fmtS1(Wave.view.b);
    e.preventDefault();
  });
  const done=async e=>{
    if(!Wave.drag) return;
    Wave.drag=null;
    try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
    await Store.saveNote(S.note);
    Loop.retune(l);
    Wave.view=Wave.window(l);
    render();
  };
  cv.addEventListener("pointerup",done);
  cv.addEventListener("pointercancel",done);
}

function tickWave(){
  const box=document.getElementById("wavebox");
  if(!box||Wave.drag) return;
  const l=loopById(box.dataset.id);
  const cv=box.querySelector("canvas");
  if(l&&cv) Wave.draw(cv,l);
}

/* ═══ 录音波形 + 与原唱对照 ═══ */
async function peaksOf(blob,sr){
  const buf=await blob.arrayBuffer();
  const ctx=getAudioContext();
  const audio=await new Promise((res,rej)=>{
    const p=ctx.decodeAudioData(buf,res,rej);
    if(p&&p.then) p.then(res,rej);
  });
  const ch=audio.getChannelData(0);
  const n=Math.max(1,Math.ceil(audio.duration*sr));
  const pk=new Float32Array(n);
  const step=ch.length/n;
  for(let i=0;i<n;i++){
    const s=(i*step)|0, e=Math.min(ch.length,((i+1)*step)|0);
    let mx=0;
    for(let j=s;j<e;j++){ const v=ch[j]<0?-ch[j]:ch[j]; if(v>mx) mx=v; }
    pk[i]=mx;
  }
  return {peaks:pk,dur:audio.duration};
}

const RecWave={
  cache:{}, busy:{},
  reset(){ this.cache={}; this.busy={}; },
  get(rec){
    if(!rec||!rec.blob) return null;
    if(this.cache[rec.id]) return this.cache[rec.id];
    if(this.busy[rec.id]) return null;
    this.busy[rec.id]=1;
    peaksOf(rec.blob,Wave.sr).then(r=>{
      this.cache[rec.id]=r; delete this.busy[rec.id];
      if(S.route==="note") render();
    }).catch(()=>{ this.cache[rec.id]="fail"; delete this.busy[rec.id]; });
    return null;
  }
};

function onsetOf(pk,sr){
  let mx=0;
  for(let i=0;i<pk.length;i++) if(pk[i]>mx) mx=pk[i];
  const th=mx*0.18;
  for(let i=0;i<pk.length;i++) if(pk[i]>=th) return i/sr;
  return 0;
}

function drawCompare(cv,rec,ref){
  if(!cv) return;
  const w=cv.clientWidth||320, h=78;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==((w*dpr)|0)||cv.height!==((h*dpr)|0)){ cv.width=(w*dpr)|0; cv.height=(h*dpr)|0; }
  const g=cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);

  const rw=RecWave.cache[rec.id];
  const mine=(rw&&rw!=="fail")?rw:null;
  const myDur=mine?mine.dur:(rec.durationMs/1000);
  const refDur=ref?Math.max(0.1,loopEnd(ref)-ref.a):0;
  const span=Math.max(myDur,refDur,0.5)*1.04;
  const xOf=t=>(t/span)*w;
  const top=18, bot=58;
  const isDark = S.theme === 'dark';

  /* 上：原唱 */
  g.fillStyle= isDark ? "#9AA3B2" : "#5A6880"; g.font="11px ui-monospace,monospace";
  if(ref){
    const useWave=Wave.state==="ok"&&Wave.peaks;
    if(useWave){
      for(let x=0;x<xOf(refDur);x++){
        const t=ref.a+(x/w)*span;
        const i=Math.round(t*Wave.sr);
        const p=(i>=0&&i<Wave.peaks.length)?Wave.peaks[i]:0;
        const amp=Math.max(0.5,p*13);
        g.fillStyle= isDark ? "#4B8FE3" : "#2F6FB8";
        g.fillRect(x,top-amp,1,amp*2);
      }
    }else{
      g.fillStyle= isDark ? "#2A3B5C" : "#CBD8EA";
      g.fillRect(0,top-5,xOf(refDur),10);
      g.fillStyle= isDark ? "#4B8FE3" : "#2F6FB8";
      g.fillRect(0,top-9,2,18);
      g.fillRect(xOf(refDur)-2,top-9,2,18);
    }
    g.fillStyle= isDark ? "#9AA3B2" : "#5A6880"; g.font="11px ui-monospace,monospace";
    g.fillText("原唱 "+refDur.toFixed(2)+"s",Math.min(xOf(refDur)+6,w-84),top+4);
  }else{
    g.fillStyle= isDark ? "#5A6880" : "#9AA3B2";
    g.fillText("這行尚未標記原曲位置",2,top+4);
  }

  /* 下：我的录音 */
  if(mine){
    for(let x=0;x<xOf(myDur);x++){
      const t=(x/w)*span;
      const i=Math.round(t*mine.sr||t*Wave.sr);
      const p=(i>=0&&i<mine.peaks.length)?mine.peaks[i]:0;
      const amp=Math.max(0.5,p*13);
      g.fillStyle= isDark ? "#E0A836" : "#B07908";
      g.fillRect(x,bot-amp,1,amp*2);
    }
  }else{
    g.fillStyle= isDark ? "#5A4C24" : "#EBD9AE";
    g.fillRect(0,bot-5,xOf(myDur),10);
  }
  g.fillStyle= isDark ? "#9AA3B2" : "#5A6880"; g.font="11px ui-monospace,monospace";
  g.fillText("我的 "+myDur.toFixed(2)+"s",Math.min(xOf(myDur)+6,w-80),bot+4);

  /* 结束位置对照虚线 */
  if(ref){
    g.strokeStyle= isDark ? "#4B8FE3" : "#2F6FB8"; g.globalAlpha=.45;
    g.setLineDash([3,3]); g.beginPath();
    g.moveTo(xOf(refDur),2); g.lineTo(xOf(refDur),h-2); g.stroke();
    g.setLineDash([]); g.globalAlpha=1;
  }
}

function cmpVerdict(rec,ref){
  const rw=RecWave.cache[rec.id];
  const mine=(rw&&rw!=="fail")?rw:null;
  const myDur=mine?mine.dur:(rec.durationMs/1000);
  if(!ref) return "標出這行在原曲裡的位置，就能跟原唱比對長短。";
  const refDur=Math.max(0.1,loopEnd(ref)-ref.a);
  const diff=myDur-refDur, pct=Math.round(Math.abs(diff)/refDur*100);
  const bits=[];
  if(Math.abs(diff)<0.15) bits.push("長度基本一致");
  else bits.push("比原唱<b>"+(diff>0?"慢":"快")+" "+Math.abs(diff).toFixed(2)+" 秒</b>（"+pct+"%）");
  if(mine){
    const on=onsetOf(mine.peaks,Wave.sr);
    if(on>0.25) bits.push("開口前空了 "+on.toFixed(2)+" 秒");
    const tail=mine.dur-((()=>{
      let last=0, mx=0;
      for(let i=0;i<mine.peaks.length;i++) if(mine.peaks[i]>mx) mx=mine.peaks[i];
      for(let i=mine.peaks.length-1;i>=0;i--) if(mine.peaks[i]>=mx*0.18){ last=i/Wave.sr; break; }
      return last;
    })());
    if(tail>0.35) bits.push("收尾後空了 "+tail.toFixed(2)+" 秒");
  }
  return bits.join("，")+"。";
}

const Practice={
  on:false, items:[], i:0, phase:"idle", timer:null, auto:true,
  build(){
    const list=paras(S.note.text);
    this.items=loops().filter(l=>l.full).slice().sort((a,b)=>a.a-b.a)
      .map(l=>({loop:l,pi:l.pi,text:list[l.pi]||l.text}))
      .filter(it=>it.text);
  },
  cur(){ return this.items[this.i]||null; },
  clearTimer(){ if(this.timer){ clearTimeout(this.timer); this.timer=null; } },
  start(){
    this.build();
    if(!this.items.length){
      toast("請先為幾行文字標註原曲位置，才能使用連續練習"); return;
    }
    this.on=true; this.i=0; this.phase="idle";
    S.sel=null; S.active=null; S.fine=null;
    render(); this.focus();
  },
  stop(){
    this.clearTimer();
    if(Recorder.active){ stopTick(); Recorder.stop().catch(()=>{}); S.recTarget=null; }
    Loop.stop(); Player.stop();
    this.on=false; this.phase="idle";
    render();
  },
  focus(){
    const it=this.cur();
    if(!it) return;
    const el=document.querySelector('.para[data-pi="'+it.pi+'"]');
    if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  },
  go(n){
    this.clearTimer(); Loop.stop(); Player.stop();
    if(Recorder.active){ stopTick(); Recorder.stop().catch(()=>{}); S.recTarget=null; }
    this.i=Math.min(Math.max(0,n),this.items.length-1);
    this.phase="idle";
    render(); this.focus();
  },
  async listen(){
    const it=this.cur();
    if(!it||!Src.controllable) return;
    this.clearTimer(); Player.stop();
    this.phase="listen"; render();
    await Loop.start(it.loop,{once:true,after:()=>{
      if(!this.on) return;
      this.phase="idle";
      if(this.auto) this.timer=setTimeout(()=>this.record(),350);
      else render();
    }});
  },
  async record(){
    const it=this.cur();
    if(!it) return;
    this.clearTimer(); Loop.stop(); Player.stop();
    const p=paras(S.note.text)[it.pi]||"";
    await beginRec({pi:it.pi,start:0,end:p.length,full:true});
    if(!S.recTarget) return;
    this.phase="record"; render();
    const span=Math.max(1.2,loopEnd(it.loop)-it.loop.a);
    this.timer=setTimeout(async()=>{
      if(!this.on||!S.recTarget) return;
      await endRec();
      if(!this.on) return;
      this.phase="idle";
      if(this.auto) this.timer=setTimeout(()=>this.playback(),250);
      else render();
    },(span*1.35+0.9)*1000/S.rate);
  },
  async playback(){
    const it=this.cur();
    if(!it) return;
    this.clearTimer();
    const r=liveRecs().find(x=>x.paraIndex===it.pi&&x.full);
    if(!r){ this.phase="idle"; render(); return; }
    this.phase="playback"; render();
    await Player.play(r,S.rate,()=>{
      if(!this.on) return;
      this.phase="done"; render();
    });
  },
  stopNow(){
    this.clearTimer(); Loop.stop(); Player.stop();
    if(Recorder.active&&S.recTarget) endRec();
    this.phase="idle"; render();
  }
};

function tokenize(text){
  const out=[]; const re=/(\s+)|([A-Za-z0-9]+(?:['\u2019][A-Za-z]+)*)|(.)/gu;
  let m;
  while((m=re.exec(text))!==null) out.push({s:m.index,e:m.index+m[0].length,t:m[0],ws:!!m[1]});
  return out;
}
function selLabel(text,start,end){
  const picked=tokenize(text).filter(tk=>!tk.ws&&tk.s>=start&&tk.e<=end);
  if(picked.length<=1){
    const w=text.slice(start,end);
    return /^[A-Za-z0-9'\u2019]+$/.test(w)?"單字":"單字";
  }
  return "此段";
}

function locate(list,r){
  if(r.full){
    const idxs=[]; list.forEach((p,i)=>{ if(p===r.text) idxs.push(i); });
    if(idxs.length===1) return {pi:idxs[0],start:0,end:list[idxs[0]].length};
    if(idxs.indexOf(r.pi!=null?r.pi:r.paraIndex)>=0){
      const k=r.pi!=null?r.pi:r.paraIndex;
      return {pi:k,start:0,end:list[k].length};
    }
    return null;
  }
  const tryIn=pi=>{
    const p=list[pi];
    if(p==null) return null;
    const first=p.indexOf(r.text);
    if(first<0) return null;
    if(p.indexOf(r.text,first+1)>=0) return null;
    return {pi:pi,start:first,end:first+r.text.length};
  };
  const home=r.pi!=null?r.pi:r.paraIndex;
  const near=tryIn(home);
  if(near) return near;
  const hits=[];
  for(let i=0;i<list.length;i++){ const h=tryIn(i); if(h) hits.push(h); }
  return hits.length===1?hits[0]:null;
}

async function repairAnchors(){
  if(!S.note) return {fixed:0,lost:0};
  const list=paras(S.note.text);
  let fixed=0, lost=0;

  for(const r of S.recs){
    const cur=list[r.paraIndex];
    if(!r.text){
      if(cur!=null){ r.text=r.full?cur:cur.slice(r.start,r.end); await Store.putRec(r); }
      continue;
    }
    const ok=cur!=null&&(r.full?cur===r.text:cur.slice(r.start,r.end)===r.text);
    if(ok){ if(r.stale){ r.stale=false; await Store.putRec(r); } continue; }
    const hit=locate(list,r);
    if(hit){ r.paraIndex=hit.pi; r.start=hit.start; r.end=hit.end; r.stale=false;
      await Store.putRec(r); fixed++; }
    else if(!r.stale){ r.stale=true; await Store.putRec(r); lost++; }
    else lost++;
  }

  let ch=false;
  const keep=[];
  for(const l of loops()){
    const cur=list[l.pi];
    const ok=cur!=null&&(l.full?cur===l.text:cur.slice(l.start,l.end)===l.text);
    if(ok){ if(l.stale){ delete l.stale; ch=true; } keep.push(l); continue; }
    const hit=locate(list,l);
    if(hit){ l.pi=hit.pi; l.start=hit.start; l.end=hit.end; delete l.stale; ch=true; keep.push(l); }
    else ch=true;
  }
  if(ch){ S.note.loops=keep; await Store.saveNote(S.note); }
  return {fixed,lost};
}

async function migrateMarks(){
  if(!S.note||!S.note.marks) return;
  const list=paras(S.note.text);
  if(!S.note.loops) S.note.loops=[];
  for(const k of Object.keys(S.note.marks)){
    const v=S.note.marks[k], pi=+k;
    const sec=typeof v==="number"?v:(v&&v.t);
    if(typeof sec!=="number") continue;
    const txt=(typeof v==="number"?list[pi]:(v&&v.x))||list[pi]||"";
    if(!txt) continue;
    S.note.loops.push({id:uid(),pi:pi,start:0,end:txt.length,full:true,text:txt,a:sec,b:null});
  }
  delete S.note.marks;
  await Store.saveNote(S.note);
}

function toast(msg,action){
  const el=document.getElementById("toast");
  document.getElementById("toastmsg").textContent=msg;
  const btn=document.getElementById("toastact");
  if(action){
    btn.hidden=false; btn.textContent=action.label;
    btn.onclick=()=>{ hideToast(); action.fn(); };
    el.classList.add("act");
  }else{ btn.hidden=true; btn.onclick=null; el.classList.remove("act"); }
  el.classList.add("show");

  toastTimer=setTimeout(hideToast,action?UNDO_MS:TOAST_MS);
}

function renderNote(){
  const list=paras(S.note.text);
  const canPrac=Src.controllable&&loops().some(l=>l.full);
  bar().innerHTML=`<button class="tbtn" data-act="back">返回</button>
    <h1 class="sub">${esc(noteTitle(S.note))}</h1>
    ${canPrac?`<button class="tbtn${Practice.on?" primary":""}" data-act="${Practice.on?"pexit":"pstart"}">${Practice.on?"離開練習":"連續練習"}</button>`:""}
    <button class="tbtn" data-act="edit">編輯</button>`;
  if(!list.length){ view().innerHTML=`<p class="empty">這篇筆記還是空的。<br>請點擊右上角「編輯」貼上文字內容。</p>`; return; }

  const html=list.map((p,pi)=>{
    const toks=tokenize(p);
    const rt=S.recTarget, recording=!!rt&&rt.pi===pi;
    const isNow=Practice.on&&Practice.cur()&&Practice.cur().pi===pi;
    const body=toks.map(tk=>{
      if(tk.ws) return esc(tk.t);
      const cov=recCovering(pi,tk.s,tk.e);
      const lp=loopsOf(pi).find(l=>!l.full&&l.start<=tk.s&&l.end>=tk.e);
      const inSel=S.sel&&S.sel.pi===pi&&S.sel.start<=tk.s&&S.sel.end>=tk.e;
      const inRec=recording&&!rt.full&&rt.start<=tk.s&&rt.end>=tk.e;
      const playing=cov&&Player.curId===cov.id;
      const ringing=lp&&Loop.id===lp.id;
      const cls=["tok",cov?"has":"",lp?"lp":"",(inSel||inRec)?"sel":"",
        playing?"play":"",ringing?"ring":""].filter(Boolean).join(" ");
      return `<span class="${cls}" data-tok data-pi="${pi}" data-s="${tk.s}" data-e="${tk.e}">${esc(tk.t)}</span>`;
    }).join("");
    const c=ctlFor(pi,p);
    const hasLineLoop=loopsOf(pi).some(l=>l.full);
    return `<div class="para${fullRec(pi)?" full":""}${hasLineLoop?" lp":""}${recording?" rec":""}${isNow?" now":""}" data-pi="${pi}" data-len="${p.length}">
      <div class="txt">${body}</div>
      ${c?`<div class="ctl">${c}</div>`:""}
    </div>`;
  }).join("");

  const tip=S.showTip?`<div class="tip"><span>長按文字可快速選取整句話！選中後，下方會出現控制按鈕：錄下自己的發音、聆聽朗讀，或是標註原曲的時間點。琥珀色標籤表示已標註的循環區段。</span>
    <button data-act="hidetip" aria-label="不再顯示">×</button></div>`:"";

  const n=liveRecs().length, ln=loops().length;
  const orph=staleRecs();
  let orphHtml="";
  if(orph.length){
    orphHtml=`<div class="orphan"><h3>有 ${orph.length} 段錄音找不到對應位置</h3>
      <p>這通常是因為修改了文字，導致原本對應的段落遺失。你可以先試聽，然後在上方重新選取文字範圍，再點擊「貼到這裡」即可修復。</p>`+
      orph.map(r=>{
        const pl=Player.curId===r.id;
        return `<div class="orow">
          <button class="${pl?"on":""}" data-act="${pl?"stopplay":"playrec"}" data-id="${r.id}"
            style="height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--rule);
            background:${pl?"var(--ink)":"var(--card)"};color:${pl?"var(--card)":"var(--ink-soft)"};
            font-size:13px;display:inline-flex;align-items:center;gap:5px">
            ${pl?ICON.stop:ICON.play}${pl?"停止":"試聽"}</button>
          <span class="q">「${esc(r.text||"")}」</span>
          <span class="dur mono" style="font-size:12px;color:var(--ink-faint)">${fmt(r.durationMs)}</span>
          ${S.sel?`<button data-act="rebind" data-id="${r.id}"
            style="height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--mark);
            background:var(--card);color:var(--mark);font-size:13px">貼到這裡</button>`:""}
          <button data-act="delrec" data-id="${r.id}" aria-label="刪除"
            style="height:28px;padding:0 8px;border-radius:14px;border:1px solid transparent;
            color:var(--ink-faint);font-size:13px">${ICON.trash}</button>
        </div>`;
      }).join("")+`</div>`;
  }

  const bits=[];
  if(n) bits.push(n+" 段錄音");
  if(ln) bits.push(ln+" 個循環點");
  view().innerHTML=tip+html+
    `<div class="foot">
      <div class="cnt">${bits.length?"本篇共計 "+bits.join(" · "):"尚無任何錄音紀錄"}</div>
      <button class="tbtn" data-act="delnote" style="color:var(--live);border-color:#F0C9C4">刪除此筆記</button>
    </div>`+orphHtml;
}

function ctlFor(pi,text){
  const rt=S.recTarget;
  if(rt&&rt.pi===pi)
    return `<button class="live" data-act="stoprec">${ICON.stop}停止錄音</button>
            <span class="dur mono" id="rectimer">0:00</span>
            <span class="quo">${rt.full?"整段":"「"+esc(text.slice(rt.start,rt.end))+"」"}</span>`;

  const out=[];
  const selHere=S.sel&&S.sel.pi===pi;
  const whole=selHere&&S.sel.start===0&&S.sel.end===text.length;

  if(selHere){
    out.push(`<button class="on" data-act="recsel">${ICON.mic}錄音</button>
              <button class="ghost" data-act="speaksel" aria-label="語音朗讀">${ICON.speaker}朗讀</button>
              ${whole?"":`<span class="quo">「${esc(text.slice(S.sel.start,S.sel.end))}」</span>`}
              <button class="ghost" data-act="clearsel" aria-label="取消選取">×</button>`);
  }

  const act=liveRecs().find(r=>r.id===S.active&&r.paraIndex===pi&&!r.full);
  if(act){
    const pl=Player.curId===act.id;
    out.push(`<button class="${pl?"on":""}" data-act="${pl?"stopplay":"playrec"}" data-id="${act.id}">
                ${pl?ICON.stop:ICON.play}${pl?"停止":"播放"}</button>
              <span class="quo">「${esc(text.slice(act.start,act.end))}」</span>
              <span class="dur mono">${fmt(act.durationMs)}</span>
              <button data-act="rerec" data-id="${act.id}">${ICON.mic}重錄</button>
              <button class="ghost" data-act="cmp" data-id="${act.id}">${S.cmp===act.id?"收起":"對比波形"}</button>
              <button class="ghost" data-act="dlrec" data-id="${act.id}" aria-label="下載音檔">${ICON.download}</button>
              <button class="ghost" data-act="delrec" data-id="${act.id}" aria-label="刪除">${ICON.trash}</button>`);
    if(S.cmp===act.id) out.push(cmpBox(act,loopExact(pi,act.start,act.end)||loopCovering(pi,act.start,act.end)));
  }

  const f=fullRec(pi);
  if(f){
    const pl=Player.curId===f.id;
    out.push(`<button class="${pl?"on":""}" data-act="${pl?"stopplay":"playrec"}" data-id="${f.id}">
                ${pl?ICON.stop:ICON.play}播放整段</button>
              <span class="dur mono">${fmt(f.durationMs)}</span>
              <button class="ghost" data-act="cmp" data-id="${f.id}">${S.cmp===f.id?"收起":"對比波形"}</button>
              <button class="ghost" data-act="dlrec" data-id="${f.id}" aria-label="下載音檔">${ICON.download}</button>
              <button class="ghost" data-act="delrec" data-id="${f.id}" aria-label="刪除">${ICON.trash}</button>`);
    if(S.cmp===f.id) out.push(cmpBox(f,loopsOf(pi).find(l=>l.full)));
  }

  if(Src.controllable){
    const own=loopsOf(pi);
    let show;
    if(selHere){
      const ex=loopExact(pi,S.sel.start,S.sel.end);
      show=ex?[ex]:own.filter(l=>l.start<=S.sel.start&&l.end>=S.sel.end);
    }else show=own;
    for(const l of show){
      const ring=Loop.id===l.id;
      const span=(typeof l.b==="number"&&l.b>l.a)?fmtS(l.a)+"–"+fmtS(l.b):fmtS(l.a)+" 起";
      out.push(`<button class="stamp${ring?" ring":""}" data-act="${ring?"unring":"ring"}" data-id="${l.id}">
                  ${ICON.loop}${ring?"循環播放":span}</button>`);
      if(selHere||ring)
        out.push(`<button class="ghost" data-act="fine" data-id="${l.id}">${S.fine===l.id?"收起":"微調"}</button>
                  <button class="ghost" data-act="delloop" data-id="${l.id}" aria-label="刪除點位">${ICON.trash}</button>`);
      if(S.fine===l.id){
        let wv="";
        if(Wave.state==="ok")
          wv=`<div class="wavebox" id="wavebox" data-id="${l.id}"><canvas></canvas></div>`;
        else if(Wave.state==="busy")
          wv=`<div class="wavebox"><div class="msg">正在繪製音訊波形…</div></div>`;
        else if(Src.kind==="yt")
          wv=`<div class="wavebox"><div class="msg">YouTube 無法繪製波形，請使用下方按鈕進行盲按對位。</div></div>`;
        else if(Wave.state==="fail")
          wv=`<div class="wavebox"><div class="msg">此音檔無法繪製波形，請使用下方按鈕對位。</div></div>`;
        out.push(`<div class="fine">
          ${wv}
          <div style="width:100%; display:flex; gap:8px; margin-bottom:4px;">
            <button class="big-sync" data-act="setnow" data-id="${l.id}" data-w="a" style="flex:1;">📍 設為起點</button>
            <button class="big-sync" data-act="setnow" data-id="${l.id}" data-w="b" style="flex:1; background:var(--ink); border-color:var(--ink);">📌 設為終點</button>
          </div>
          <div style="width:100%; display:flex; align-items:center; gap:4px; margin-top:2px;">
            <span class="lb" id="finelab">起 ${fmtS1(l.a)}   止 ${typeof l.b==="number"?fmtS1(l.b):"自動 "+fmtS1(loopEnd(l))}</span>
            <span style="flex:1"></span>
            <button class="nudge" data-act="nudge" data-id="${l.id}" data-w="a" data-d="-1" title="起點提前0.2秒">起 -</button>
            <button class="nudge" data-act="nudge" data-id="${l.id}" data-w="a" data-d="1" title="起點延後0.2秒">起 +</button>
            <button class="nudge" data-act="nudge" data-id="${l.id}" data-w="b" data-d="-1" title="終點提前0.2秒">止 -</button>
            <button class="nudge" data-act="nudge" data-id="${l.id}" data-w="b" data-d="1" title="終點延後0.2秒">止 +</button>
          </div>
        </div>`);
      }
    }
    if(selHere&&!loopExact(pi,S.sel.start,S.sel.end))
      out.push(`<button class="ghost" data-act="mkloop">${ICON.loop}標記原曲位置</button>`);
  }
  return out.join("");
}
