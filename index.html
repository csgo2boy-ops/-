function doSentenceSelect(tk) {
  const pi = +tk.dataset.pi;
  const p = paras(S.note.text)[pi];
  const sIdx = +tk.dataset.s;
  const eIdx = +tk.dataset.e;
  const punct = /[.,?!;:，。？！；：\n]/;
  let start = 0, end = p.length;
  for(let i=sIdx-1; i>=0; i--) {
    if(punct.test(p[i])) { start = i+1; break; }
  }
  for(let i=eIdx; i<p.length; i++) {
    if(punct.test(p[i])) { end = i; break; }
  }
  while(start < end && p[start].trim() === '') start++;
  while(end > start && p[end-1].trim() === '') end--;

  if(start < end) {
    S.sel = {pi, start, end};
    S.active = null; S.fine = null;
    if(navigator.vibrate) navigator.vibrate(40); 
    render();
    const sel = window.getSelection();
    if(sel) sel.removeAllRanges();
  }
}

function readSelection(){
  const s=window.getSelection();
  if(!s||s.isCollapsed||s.rangeCount===0) return null;
  const range=s.getRangeAt(0);
  const node=range.commonAncestorContainer;
  const host=(node.nodeType===1?node:node.parentElement);
  const paraEl=host&&host.closest?host.closest(".para"):null;
  if(!paraEl) return null;
  let lo=Infinity, hi=-1;
  paraEl.querySelectorAll("[data-tok]").forEach(el=>{
    let hit=false;
    try{ hit=range.intersectsNode(el); }catch(_){}
    if(hit){ lo=Math.min(lo,+el.dataset.s); hi=Math.max(hi,+el.dataset.e); }
  });
  if(hi<0) return null;
  return {pi:+paraEl.dataset.pi, start:lo, end:hi};
}
document.addEventListener("selectionchange",()=>{
  if(S.route!=="note"||S.recTarget) return;
  const sel=readSelection();
  if(!sel) return;
  if(S.sel&&S.sel.pi===sel.pi&&S.sel.start===sel.start&&S.sel.end===sel.end) return;
  S.sel=sel; S.active=null; S.fine=null; render();
});

async function beginRec(target){
  if(S.recTarget) return;
  Player.stop(); Loop.stop(); Src.pause();
  if(Src.kind==="embed") toast("請手動暫停外部播放器，以免錄入背景音");
  try{ await Recorder.start(); }
  catch(err){
    const n=err&&err.name;
    if(n==="NotAllowedError"||n==="SecurityError") micHelp();
    else if(n==="NotFoundError"||n==="OverconstrainedError") toast("找不到麥克風設備");
    else if(n==="NotReadableError") toast("麥克風被其他程式佔用，請關閉通話後再試");
    else if(err&&err.message==="NO_API")      toast("瀏覽器拒絕錄音，請確認網址為 https。");
    else if(err&&err.message==="NO_RECORDER") toast("您目前的瀏覽器不支援錄音功能。");
    else                                      toast("麥克風啟動失敗："+(n||"未知錯誤"));
    return;
  }
  S.recTarget=target; S.sel=null; S.active=null; S.fine=null;
  const s=window.getSelection(); if(s) s.removeAllRanges();
  render(); startTick();
}
async function endRec(){
  const t=S.recTarget;
  if(!t) return;
  stopTick();
  const out=await Recorder.stop();
  S.recTarget=null;
  if(!out||out.durationMs<MIN_REC_MS){ render(); toast("時間太短，未儲存錄音"); return; }
  const p=paras(S.note.text)[t.pi]||"";
  const kill=S.recs.filter(r=>{
    if(r.stale||r.paraIndex!==t.pi) return false;
    if(t.full) return !!r.full;
    if(r.full) return false;
    return r.start<t.end && r.end>t.start;
  });
  for(const r of kill) await Store.deleteRec(r.id);
  if(kill.length) S.recs=S.recs.filter(r=>kill.indexOf(r)===-1);
  const rec={id:uid(),noteId:S.note.id,paraIndex:t.pi,full:!!t.full,
    start:t.start,end:t.end,text:t.full?p:p.slice(t.start,t.end),
    blob:out.blob,durationMs:out.durationMs};
  await Store.putRec(rec);
  S.recs.push(rec);
  S.active=t.full?null:rec.id;
  render();
  toast(kill.length>1 ? "已儲存 "+fmt(out.durationMs)+"，並取代了 "+kill.length+" 段重疊錄音"
                      : "成功儲存 "+fmt(out.durationMs));
}

function applySource(){
  Src.clear(); Wave.reset();
  if(S.media&&S.media.blob){
    Src.loadAudio(S.media.blob,true);
    Wave.build(S.media.blob);
    return;
  }
  const info=parseSource((S.note.sourceUrl||"").trim());
  if(info.type==="audio"){
    Src.loadAudio(info.src,false);
    fetch(info.src).then(r=>r.ok?r.blob():null)
      .then(b=>{ if(b) Wave.build(b); else Wave.state="fail"; })
      .catch(()=>{ Wave.state="fail"; });
  }
  else if(info.type==="yt") Src.loadYT(info.id,info.start);
  else if(info.type==="embed") Src.loadEmbed(info);
}
async function openNote(id){
  Src.clear(); Wave.reset(); RecWave.reset();
  Practice.on=false; Practice.phase="idle"; Practice.clearTimer();
  S.note=await Store.getNote(id);
  if(!S.note.loops) S.note.loops=[];
  if(!S.note.tags) S.note.tags=[];
  if(!S.note.ttsLang) S.note.ttsLang="";
  await migrateMarks();
  S.recs=await Store.listRecs(id);
  S.media=await Store.getMedia(id);
  S.route="note"; S.sel=null; S.active=null; S.fine=null; S.cmp=null;
  const res=await repairAnchors();
  render();
  applySource();
  render();
  if(res.fixed) toast("自動對齊了 "+res.fixed+" 段錄音的位置");
}
function leaveNote(){
  Practice.stop();
  stopTick(); Player.stop(); Recorder.release(); Src.clear(); Wave.reset(); RecWave.reset();
  S.note=null; S.recs=[]; S.media=null; S.sel=null; S.active=null; S.recTarget=null;
  S.fine=null; S.cmp=null; S.isNew=false;
}
async function refreshCounts(){
  const all=await Store.allRecs();
  const c={}; all.forEach(r=>{ if(!r.stale) c[r.noteId]=(c[r.noteId]||0)+1; });
  S.counts=c;
}

const b64=blob=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(String(r.result).split(",")[1]);
  r.onerror=()=>rej(r.error);
  r.readAsDataURL(blob);
});
function fromB64(s,type){
  const bin=atob(s), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:type||"audio/webm"});
}
async function doBackup(){
  toast("備份封裝中，請稍候…");
  const notes=await Store.listNotes(), recs=await Store.allRecs();
  const out={v:3,at:Date.now(),notes:notes.map(n=>({
      id:n.id,title:n.title||"",text:n.text||"",sourceUrl:n.sourceUrl||"",
      loops:n.loops||[],tags:n.tags||[],ttsLang:n.ttsLang||"",marks:n.marks||undefined,updatedAt:n.updatedAt})),recs:[]};
  for(const r of recs){
    if(!r.blob||!r.blob.size) continue;
    out.recs.push({id:r.id,noteId:r.noteId,paraIndex:r.paraIndex,full:!!r.full,
      start:r.start,end:r.end,text:r.text||"",stale:!!r.stale,durationMs:r.durationMs,
      type:r.blob.type||"audio/webm",data:await b64(r.blob)});
  }
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="跟讀筆記備份-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  await Store.setKV("lastBackup",Date.now());
  toast("成功匯出 "+out.notes.length+" 篇筆記與 "+out.recs.length+" 段錄音");
}
async function doRestore(file){
  let data;
  try{ data=JSON.parse(await file.text()); }
  catch(_){ toast("檔案格式錯誤，無法讀取"); return; }
  if(!data||!Array.isArray(data.notes)){ toast("這不是有效的備份檔案"); return; }
  if(!confirm("即將匯入 "+data.notes.length+" 篇筆記？\n若有相同 ID 的筆記將會被覆蓋。\n備份檔案不含原曲音檔，匯入後需重新選取。")) return;
  for(const n of data.notes) await Store.saveNote(Object.assign({},n,{loops:n.loops||[], tags:n.tags||[], ttsLang:n.ttsLang||""}));
  for(const r of (data.recs||[])){
    try{
      await Store.putRec({id:r.id,noteId:r.noteId,paraIndex:r.paraIndex,full:!!r.full,
        start:r.start,end:r.end,text:r.text||"",stale:!!r.stale,
        durationMs:r.durationMs,blob:fromB64(r.data,r.type)});
    }catch(_){}
  }
  S.notes=await Store.listNotes(); await refreshCounts(); render();
  toast("匯入完成，請記得重新設定本地音檔。");
}

function applyLRCText(text){
  const lrc=parseLRC(text);
  if(!lrc.lines.length){ toast("沒讀到時間戳，確認一下格式是不是 [00:12.34] 這種"); return; }
  if(!paras(S.draft).length){
    const seen={}, rows=[];
    for(const l of lrc.lines){ if(seen[l.text]) continue; seen[l.text]=1; rows.push(l.text); }
    S.draft=rows.join("\n");
  }
  const list=paras(S.draft);
  const res=lrcToLoops(lrc,list);
  if(!res.hit){
    toast("時間軸讀到了，但沒有一行對得上正文。檢查歌詞是不是同一個版本");
    render(); return;
  }
  S.draftLoops=res.loops;
  S.lrcOpen=false; S.lrcText="";
  render();
  const words=res.loops.filter(l=>!l.full).length;
  toast("對上了 "+res.hit+"/"+res.total+" 行"+(words?"，另有 "+words+" 個詞級時間點":"")+"，按「完成」生效");
}
async function doExportLRC(){
  const txt=buildLRC();
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(noteTitle(S.note).replace(/[\\/:*?"<>|]/g,"_"))+".lrc";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("導出了 "+loops().filter(l=>l.full).length+" 行時間軸");
}

document.getElementById("filepick").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f) return;
  if(f.size>MAX_FILE_MB*1024*1024){ toast("檔案超過容量限制（最大 "+MAX_FILE_MB+"MB）"); return; }
  S.draftFile=f; S.draftDropMedia=false; render();
});
document.getElementById("jsonpick").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(f) await doRestore(f);
});
document.getElementById("lrcpick").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(!f) return;
  try{ applyLRCText(await f.text()); }
  catch(_){ toast("這個檔案無法讀取"); }
});

document.addEventListener("click",async e=>{
  if(e.target.closest("#toast")) return;

  const sheetEl=document.getElementById("sheet");
  if(sheetEl.classList.contains("show")&&!e.target.closest(".sheetbox")){ closeSheet(); return; }
  const tt=e.target.closest("[data-act]");
  if(tt){
    const a0=tt.dataset.act;
    if(a0==="opensheet"){ openSheet(false); return; }
    if(a0==="closesheet"){ closeSheet(); return; }
    if(a0==="skipupdate"){ hideNewVer(); return; }
    if(a0==="doupdate"){
      hideNewVer();
      if(swWaiting) swWaiting.postMessage("skip-waiting");
      else location.reload();
      return;
    }
  }

  const t=e.target.closest("[data-act]");

  const tk=e.target.closest("[data-tok]");
  if(tk&&!t){
    if(S.recTarget) return;
    const s=window.getSelection();
    if(s&&!s.isCollapsed) return;
    const pi=+tk.dataset.pi, st=+tk.dataset.s, en=+tk.dataset.e;
    const cov=recCovering(pi,st,en);
    if(cov){ S.sel=null; S.fine=null; S.active=cov.id; await Player.play(cov,S.rate); return; }
    S.active=null; S.fine=null;
    if(S.sel&&S.sel.pi===pi){
      if(S.sel.start===st&&S.sel.end===en) S.sel=null;
      else S.sel={pi,start:Math.min(S.sel.start,st),end:Math.max(S.sel.end,en)};
    }else S.sel={pi,start:st,end:en};
    render(); return;
  }

  if(!t){
    const pe=e.target.closest(".para");
    if(pe&&!S.recTarget&&e.target.classList.contains("txt")){
      const s=window.getSelection();
      if(s&&!s.isCollapsed) return;
      const pi=+pe.dataset.pi, len=+pe.dataset.len;
      S.active=null; S.fine=null;
      S.sel=(S.sel&&S.sel.pi===pi&&S.sel.start===0&&S.sel.end===len)?null:{pi,start:0,end:len};
      render();
    }
    return;
  }

  const act=t.dataset.act;
  if(act==="new"){
    S.note={id:uid(),title:"",text:"",sourceUrl:"",loops:[],tags:[],ttsLang:"",updatedAt:Date.now()};
    S.isNew=true; S.recs=[]; S.media=null;
    S.draft=""; S.draftTitle=""; S.draftUrl=""; S.draftFile=null; S.draftDropMedia=false;
    S.draftLoops=null; S.draftTags=[]; S.draftTtsLang=""; S.lrcOpen=false; S.lrcText="";
    S.route="edit"; render();
  }
  else if(act==="open") await openNote(t.dataset.id);
  else if(act==="back"){
    leaveNote(); S.notes=await Store.listNotes(); await refreshCounts();
    S.route="list"; render();
  }
  else if(act==="backup"){
    if(confirm("確定要匯出備份檔案？\n內含所有文字、錄音與標記，但不包含原曲音檔。\n（選擇「取消」可改為執行匯入動作）")) await doBackup();
    else document.getElementById("jsonpick").click();
  }
  else if(act==="restore"){
    document.getElementById("jsonpick").click();
  }
  else if(act==="theme"){
    S.theme = S.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', S.theme);
    await Store.setKV("theme", S.theme);
    render();
  }
  else if(act==="adddrafttag"){
    const input = document.getElementById("tag_text");
    const colorInput = document.getElementById("tag_color");
    const text = input.value.trim();
    if(text){
      S.draftTags.push({text: text, color: colorInput.value});
      renderEdit();
      setTimeout(()=>document.getElementById("tag_text").focus(), 30);
    }
  }
  else if(act==="deldrafttag"){
    S.draftTags.splice(+t.dataset.idx, 1);
    renderEdit();
  }
  else if(act==="settag"){
    S.activeTag = t.dataset.tag || null;
    render();
  }
  else if(act==="delnotequick"){
    e.stopPropagation(); 
    if(confirm("確定要刪除這篇筆記嗎？\n(包含所有錄音和設定，無法復原)")){
      const id = t.dataset.id;
      await Store.deleteNote(id);
      S.notes = await Store.listNotes();
      await refreshCounts();
      render();
      toast("筆記已刪除");
    }
  }
  else if(act==="hidetip"){ S.showTip=false; await Store.setKV("showTip",false); render(); }
  else if(act==="togglevol"){
    S.volOpen=!S.volOpen;
    await Store.setKV("volOpen",S.volOpen);
    renderSrcBar();
  }
  else if(act==="foldmedia"){
    S.mediaOpen=!S.mediaOpen;
    await Store.setKV("mediaOpen",S.mediaOpen);
    renderSrcBar();
  }
  else if(act==="edit"){
    Player.stop(); Loop.stop(); Src.pause();
    S.draft=S.note.text; S.draftTitle=S.note.title||""; S.draftUrl=S.note.sourceUrl||"";
    S.draftTags=(S.note.tags||[]).map(t => typeof t === 'string' ? {text: t, color: '#4B8FE3'} : t);
    S.draftTtsLang = S.note.ttsLang || "";
    S.draftFile=null; S.draftDropMedia=false; S.draftLoops=null;
    S.lrcOpen=false; S.lrcText=""; S.route="edit"; render();
  }
  else if(act==="cancel"){
    if(S.isNew){
      S.isNew=false; leaveNote();
      S.notes=await Store.listNotes(); await refreshCounts();
      S.route="list"; render();
    }else{ S.route="note"; render(); }
  }
  else if(act==="pickfile") document.getElementById("filepick").click();
  else if(act==="dropfile"){ S.draftFile=null; S.draftDropMedia=true; render(); }
  else if(act==="picklrc") document.getElementById("lrcpick").click();
  else if(act==="togglelrc"){ S.lrcOpen=!S.lrcOpen; render(); }
  else if(act==="applylrc"){ applyLRCText(S.lrcText); }
  else if(act==="exportlrc") await doExportLRC();
  else if(act==="save"){
    const oldUrl=S.note.sourceUrl||"", hadMedia=!!S.media;
    S.note.text=S.draft;
    S.note.title=S.draftTitle.trim();
    
    // 過濾 javascript: 惡意連結
    let cleanUrl = S.draftUrl.trim();
    if(cleanUrl.toLowerCase().startsWith('javascript:')) cleanUrl = "";
    S.note.sourceUrl = cleanUrl;

    S.note.tags = S.draftTags;
    S.note.ttsLang = document.getElementById("ttslang").value;

    if(S.isNew&&!S.note.text.trim()&&!S.note.title&&!S.note.sourceUrl&&!S.draftFile){
      S.isNew=false; leaveNote();
      S.notes=await Store.listNotes(); await refreshCounts();
      S.route="list"; render();
      toast("內容為空，已取消新增");
      return;
    }

    if(S.draftFile){
      await Store.putMedia({noteId:S.note.id,name:S.draftFile.name,
        type:S.draftFile.type||"audio/mpeg",blob:S.draftFile});
      S.media=await Store.getMedia(S.note.id);
    }else if(S.draftDropMedia){ await Store.deleteMedia(S.note.id); S.media=null; }
    S.note.hasMedia=!!S.media;
    if(S.draftLoops){ S.note.loops=S.draftLoops; S.draftLoops=null; }
    await Store.saveNote(S.note);
    if(S.isNew){ S.isNew=false; S.notes.unshift(S.note); }
    S.draftFile=null; S.draftDropMedia=false;
    S.draftTags=[]; S.draftTtsLang="";
    S.lrcOpen=false; S.lrcText="";
    S.route="note"; S.sel=null; S.fine=null;
    const res=await repairAnchors();
    render();
    if(oldUrl!==S.note.sourceUrl||hadMedia!==!!S.media||!Src.kind) applySource();
    render();
    if(res.lost) toast("有 "+res.lost+" 段錄音遺失對應位置，請至頁面底端查看");
    else if(res.fixed) toast("已自動修復 "+res.fixed+" 段錄音的位置");
  }
  else if(act==="cmp"){
    S.cmp=(S.cmp===t.dataset.id)?null:t.dataset.id;
    render();
  }
  else if(act==="pstart"){ Practice.start(); }
  else if(act==="pexit"){ Practice.stop(); }
  else if(act==="pprev"){ Practice.go(Practice.i-1); }
  else if(act==="pnext"){ Practice.go(Practice.i+1); }
  else if(act==="plisten"){ await Practice.listen(); }
  else if(act==="prec"){ await Practice.record(); }
  else if(act==="pplay"){ await Practice.playback(); }
  else if(act==="pstop"){ Practice.stopNow(); }
  else if(act==="pauto"){
    Practice.auto=!Practice.auto;
    await Store.setKV("pauto",Practice.auto);
    render();
  }
  else if(act==="srctoggle"){ if(!Loop.on) Player.stop(); await Src.toggle(); }
  else if(act==="srcback") Src.jump(-5);
  else if(act==="srcfwd") Src.jump(5);

  else if(act==="mkloop"){
    if(!S.sel||!Src.controllable) return;
    const p=paras(S.note.text)[S.sel.pi]||"";
    const whole=S.sel.start===0&&S.sel.end===p.length;
    const lp={id:uid(),pi:S.sel.pi,start:S.sel.start,end:S.sel.end,full:whole,
      text:whole?p:p.slice(S.sel.start,S.sel.end),a:Src.now(),b:null};
    S.note.loops.push(lp);
    await Store.saveNote(S.note);
    S.fine=lp.id;
    await Loop.start(lp);
    toast("起點已設定為 "+fmtS1(lp.a)+"，請利用微調校準，或點擊「📌設為終點」完成區段");
  }
  else if(act==="ring"){
    const l=loopById(t.dataset.id);
    if(l) await Loop.start(l);
  }
  else if(act==="unring") Loop.stop();
  else if(act==="fine"){
    S.fine=(S.fine===t.dataset.id)?null:t.dataset.id;
    render();
  }
  else if(act==="nudge"){
    const l=loopById(t.dataset.id);
    if(!l) return;
    const w=t.dataset.w, d=+t.dataset.d*NUDGE;
    if(w==="a") l.a=Math.max(0,l.a+d);
    else l.b=Math.max(l.a+0.2,(typeof l.b==="number"?l.b:loopEnd(l))+d);
    await Store.saveNote(S.note);
    Loop.retune(l);
    render();
  }
  else if(act==="setnow"){
    const l=loopById(t.dataset.id);
    if(!l||!Src.controllable) return;
    const c=Src.now();
    if(t.dataset.w==="a") l.a=Math.max(0,c);
    else l.b=Math.max(l.a+0.2,c+TAIL_PAD);
    await Store.saveNote(S.note);
    Loop.retune(l);
    render();
    toast(t.dataset.w==="a"?"起點更新為 "+fmtS1(l.a):"終點更新為 "+fmtS1(l.b));
  }
  else if(act==="delloop"){
    const id=t.dataset.id, l=loopById(id);
    if(!l) return;
    if(Loop.id===id) Loop.stop();
    S.note.loops=loops().filter(x=>x.id!==id);
    if(S.fine===id) S.fine=null;
    await Store.saveNote(S.note);
    render();
    toast("已刪除該循環標記",{label:"還原",fn:async()=>{
      S.note.loops.push(l); await Store.saveNote(S.note); render();
    }});
  }
  else if(act==="clearsel"){ S.sel=null; S.fine=null; const s=window.getSelection(); if(s) s.removeAllRanges(); render(); }
  else if(act==="speaksel"){
    if(S.sel){
      const p = paras(S.note.text)[S.sel.pi] || "";
      const textToSpeak = S.sel.start === 0 && S.sel.end === p.length ? p : p.slice(S.sel.start, S.sel.end);
      
      if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(textToSpeak);
        
        if (S.note.ttsLang) {
          msg.lang = S.note.ttsLang;
        } else {
          if(/[a-zA-Z]/.test(textToSpeak) && !/[\u4e00-\u9fa5]/.test(textToSpeak)) msg.lang = 'en-US';
          else msg.lang = 'zh-TW';
        }
        msg.rate = S.rate;
        window.speechSynthesis.speak(msg);
      } else {
        toast("您的設備不支援語音朗讀功能");
      }
    }
  }
  else if(act==="recsel"){ if(S.sel) await beginRec({pi:S.sel.pi,start:S.sel.start,end:S.sel.end,
      full:S.sel.start===0&&S.sel.end===(paras(S.note.text)[S.sel.pi]||"").length}); }
  else if(act==="rerec"){
    const r=S.recs.find(x=>x.id===t.dataset.id);
    if(r) await beginRec({pi:r.paraIndex,start:r.start,end:r.end,full:r.full});
  }
  else if(act==="stoprec") await endRec();
  else if(act==="playrec"){
    const r=S.recs.find(x=>x.id===t.dataset.id);
    if(r){ if(!r.full&&!r.stale) S.active=r.id; await Player.play(r,S.rate); }
  }
  else if(act==="stopplay") Player.stop();
  else if(act==="rebind"){
    const r=S.recs.find(x=>x.id===t.dataset.id);
    if(!r||!S.sel) return;
    const p=paras(S.note.text)[S.sel.pi]||"";
    const whole=S.sel.start===0&&S.sel.end===p.length;
    r.paraIndex=S.sel.pi; r.start=S.sel.start; r.end=S.sel.end;
    r.full=whole; r.text=whole?p:p.slice(S.sel.start,S.sel.end); r.stale=false;
    await Store.putRec(r);
    S.sel=null; S.active=r.full?null:r.id;
    render(); toast("修復完成");
  }
  else if(act==="dlrec"){
    const r=S.recs.find(x=>x.id===t.dataset.id);
    if(!r || !r.blob) return;
    const url = URL.createObjectURL(r.blob);
    const a = document.createElement("a");
    a.href = url;
    const ext = r.blob.type.includes("mp4") ? ".mp4" : ".webm";
    a.download = "我的跟讀_" + new Date().getTime() + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("開始下載錄音檔案");
  }
  else if(act==="delrec"){
    const r=S.recs.find(x=>x.id===t.dataset.id);
    if(!r) return;
    if(Player.curId===r.id) Player.stop();
    await Store.deleteRec(r.id);
    S.recs=S.recs.filter(x=>x.id!==r.id);
    if(S.active===r.id) S.active=null;
    render();
    toast("已刪除長度 "+fmt(r.durationMs)+" 的錄音",{label:"還原",fn:async()=>{
      await Store.putRec(r); S.recs.push(r); render(); toast("已成功復原");
    }});
  }
  else if(act==="delnote"){
    if(confirm("確定要刪除這篇筆記嗎？\n(包含所有錄音、時間軸與原始音檔，無法復原)")){
      const id=S.note.id; leaveNote();
      await Store.deleteNote(id);
      S.notes=await Store.listNotes(); await refreshCounts();
      S.route="list"; render();
    }
  }
  else if(act==="rate"){
    S.rate=+t.dataset.r;
    await Store.setKV("rate",S.rate);
    if(Player.el&&Player.curId) Player.el.playbackRate=S.rate;
    Src.setRate(S.rate);
    render();
  }
});

document.addEventListener("keydown",async e=>{
  if(e.key==="Escape"&&document.getElementById("sheet").classList.contains("show")){
    closeSheet(); return;
  }
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="iframe") return;
  if(S.route!=="note") return;
  if(Practice.on){
    if(e.code==="Space"){
      e.preventDefault();
      if(Practice.phase==="record") Practice.stopNow();
      else if(Practice.phase==="idle"||Practice.phase==="done") await Practice.listen();
      else Practice.stopNow();
      return;
    }
    if(e.key==="ArrowDown"||e.key==="Enter"){ e.preventDefault(); Practice.go(Practice.i+1); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); Practice.go(Practice.i-1); return; }
    if(e.key==="r"||e.key==="R"){ e.preventDefault(); await Practice.record(); return; }
    if(e.key==="Escape"){ Practice.stop(); return; }
  }
  if(e.code==="Space"){
    e.preventDefault();
    if(S.recTarget) await endRec();
    else if(Src.controllable) await Src.toggle();
  }else if(e.key==="Escape"){
    if(S.recTarget) await endRec();
    else if(Loop.on) Loop.stop();
    else if(S.sel){ S.sel=null; S.fine=null; const s=window.getSelection(); if(s) s.removeAllRanges(); render(); }
    else Player.stop();
  }else if(e.key==="ArrowLeft"&&Src.controllable){ e.preventDefault(); Src.jump(-5); }
  else if(e.key==="ArrowRight"&&Src.controllable){ e.preventDefault(); Src.jump(5); }
});

window.addEventListener("pagehide",()=>{Practice.stop();stopTick();Player.stop();Loop.stop();Recorder.release();Src.clear()});

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
}
async function openSheet(first){
  const box=document.getElementById("sheetbox");
  
  let storageInfo = "";
  if(navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      const mb = (est.usage / 1048576).toFixed(1);
      const limitStr = est.quota > 1073741824 
        ? (est.quota / 1073741824).toFixed(1) + ' GB' 
        : (est.quota / 1048576).toFixed(0) + ' MB';
      storageInfo = `<div style="margin-top:16px; padding:10px; background:var(--sel); border-radius:8px;">
        <span style="font-size:13px; color:var(--mark);">💾 儲存空間狀態：目前已使用約 <b>${mb} MB</b> (可用額度: ${limitStr})。<br>
        若容量接近上限，請考慮匯出備份並刪除舊筆記。</span>
      </div>`;
    } catch(e) {}
  }

  const installTip=isStandalone()?"" :
    isIOS()
      ? `<h3>裝到主畫面</h3>
         <p>用 Safari 打開這一頁，點下方中間的<b>分享</b>按鈕，往下找到
         <b>「加入主畫面」</b>。之後桌面上會多一個圖示，打開是全螢幕的，跟一般 App 一樣。</p>`
      : `<h3>裝到主畫面</h3>
         <p>Chrome 網址列右側通常會出現一個安裝圖示，或者從右上角選單裡找
         <b>「安裝應用程式」</b>。裝好後可以脫離瀏覽器視窗單獨打開。</p>`;
  box.innerHTML=`
    <h2>關於跟讀筆記</h2>
    <p>這是一款語言學習輔助工具：將歌詞或課文切割為小段，標註原曲位置反覆聆聽，並錄下自己的發音進行對比。</p>

    <div class="warn"><p><b>隱私安全與資料儲存說明</b><br>
    您的所有筆記、錄音、時間軸皆完全儲存在「目前的瀏覽器」中，<b>不會上傳至任何雲端伺服器</b>。
    優點是極高的隱私性；但相對地，<b>若您清除瀏覽器資料、更換設備或瀏覽器，所有內容將會永久遺失</b>。</p></div>

    <h3>強烈建議定期備份</h3>
    <p>請利用首頁右上角的「匯出」按鈕下載備份檔 (.json)。完成一首曲目的練習後就可匯出一次，並保存在雲端硬碟中。未來更換設備時，可隨時「匯入」還原資料。</p>
    <p>備份檔不含外部原曲音檔，還原後需重新選取本地音檔。</p>

    <h3>麥克風權限說明</h3>
    <p>本服務之錄音功能皆在設備端完成處理。若無法錄音，請檢查瀏覽器設定中的「網站權限」，並確認已允許麥克風存取。</p>

    <h3>版權與免責聲明</h3>
    <p>本站不提供任何文字、音樂或影音內容。所有內容皆由使用者自行輸入或匯入。使用外部連結（如 YouTube）皆為官方嵌入播放器，遵守各平台服務條款。</p>
    ${installTip}
    ${storageInfo}

    <button class="close" data-act="closesheet">${first?"我瞭解了，開始使用":"關閉"}</button>`;
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("show"); }

async function maybeRemindBackup(){
  const recs=await Store.allRecs();
  if(recs.length<8) return;
  const last=await Store.getKV("lastBackup",0);
  const days=(Date.now()-last)/86400000;
  if(days<7) return;
  toast(last?"距離上次備份已經 "+Math.floor(days)+" 天了":"您已累積了 "+recs.length+" 段錄音，強烈建議匯出備份",
    {label:"立刻備份",fn:async()=>{ await doBackup(); }});
}

let swWaiting=null;
function setupSW(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:"&&location.hostname!=="localhost"&&location.hostname!=="127.0.0.1") return;
  navigator.serviceWorker.register("./sw.js").then(reg=>{
    if(reg.waiting){ swWaiting=reg.waiting; showNewVer(); }
    reg.addEventListener("updatefound",()=>{
      const sw=reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange",()=>{
        if(sw.state==="installed"&&navigator.serviceWorker.controller){
          swWaiting=sw; showNewVer();
        }
      });
    });
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading) return;
    reloading=true;
    location.reload();
  });
}
function showNewVer(){ document.getElementById("newver").classList.add("show"); }
function hideNewVer(){ document.getElementById("newver").classList.remove("show"); }
